name: CI
#
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: [push, pull_request]
#  push:
#    branches: [ master ]
jobs: 
  build:
    name: "Build ${{ matrix.profile }} on JDK 25"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: ['jdk8+', 'jdk21+']
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: 25.0.0
      - name: Build profile
        run: mvn -B package -DskipTests -P${{ matrix.profile }}
      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.profile }}
          path: target/
          if-no-files-found: error
          retention-days: 1
      - name: Build patched JDK25
        run: ./build-jdk.sh

  test:
    name: "Test ${{ matrix.profile }} on JDK ${{ matrix.java }}"
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: jdk8+
            java: '8'
          - profile: jdk8+
            java: '11'
          - profile: jdk8+
            java: '17'
          - profile: jdk8+
            java: '21'
          - profile: jdk8+
            java: '25'
          - profile: jdk21+
            java: '21'
          - profile: jdk21+
            java: '25'
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: ${{ matrix.java }}
      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-${{ matrix.profile }}
          path: target/
      - name: Run tests on prebuilt classes
        run: mvn -B -P${{ matrix.profile }} surefire:test
