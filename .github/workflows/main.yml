name: CI
on: [push, pull_request]

jobs:
  build:
    name: Build on JDK 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
          distribution: zulu
          java-version: 25.0.0
      - name: Build both implementations
        run: mvn -B package
      - name: Prepare Maven staging inputs
        shell: bash
        run: |
          set -euo pipefail
          api_jar=$(find code/target -maxdepth 1 -name 'nb-javac-*-api.jar' -print -quit)
          if [[ -z "$api_jar" ]]; then
            echo "No API JAR found in code/target/." >&2
            exit 1
          fi
          version=$(basename "$api_jar")
          version=${version#nb-javac-}
          version=${version%-api.jar}
          mkdir -p maven-staging
          for suffix in "" "-api" "-sources" "-jdk21" "-jdk21-sources"; do
            cp "code/target/nb-javac-${version}${suffix}.jar" maven-staging/
          done
          cp code/.flattened-pom.xml "maven-staging/nb-javac-${version}.pom"
      - name: Upload Maven staging inputs
        uses: actions/upload-artifact@v4
        with:
          name: maven-input
          path: maven-staging/
          if-no-files-found: error
          retention-days: 1
      - name: Upload JDK 8+ compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-run-on-jdk8
          path: |
            runtime/run-on-jdk8/target/classes/
            runtime/run-on-jdk8/target/test-classes/
          if-no-files-found: error
          retention-days: 1
      - name: Upload JDK 21+ compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-run-on-jdk21
          path: |
            runtime/run-on-jdk21/target/classes/
            runtime/run-on-jdk21/target/test-classes/
          if-no-files-found: error
          retention-days: 1
      - name: Build patched JDK 25
        run: ./build-jdk.sh

  test:
    name: "Test ${{ matrix.module }} on JDK ${{ matrix.java }}"
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: run-on-jdk8
            java: '8'
          - module: run-on-jdk8
            java: '11'
          - module: run-on-jdk8
            java: '17'
          - module: run-on-jdk8
            java: '21'
          - module: run-on-jdk8
            java: '25'
          - module: run-on-jdk21
            java: '21'
          - module: run-on-jdk21
            java: '25'
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v2
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-${{ matrix.module }}
          path: runtime/${{ matrix.module }}/target/
      - name: Download published JARs
        uses: actions/download-artifact@v4
        with:
          name: maven-input
          path: maven-staging/
      - name: Run tests on prebuilt classes
        run: mvn -B -pl runtime/${{ matrix.module }} surefire:test
      - name: Test published API and implementation JARs
        shell: bash
        run: |
          set -euo pipefail
          api_jar=$(find maven-staging -name 'nb-javac-*-api.jar' -print -quit)
          version=$(basename "$api_jar")
          version=${version#nb-javac-}
          version=${version%-api.jar}
          impl="maven-staging/nb-javac-${version}.jar"
          if [[ "${{ matrix.module }}" == "run-on-jdk21" ]]; then
            impl="maven-staging/nb-javac-${version}-jdk21.jar"
          fi
          junit="$HOME/.m2/repository/junit/junit/4.12/junit-4.12.jar"
          hamcrest="$HOME/.m2/repository/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          tests="runtime/${{ matrix.module }}/target/test-classes:$junit:$hamcrest"
          if [[ "${{ matrix.java }}" == "8" ]]; then
            java -Xbootclasspath/p:"$api_jar:$impl" -cp "$tests" org.junit.runner.JUnitCore com.sun.source.util.TreesTest com.sun.tools.javac.parser.JavacParserTest
          else
            java --limit-modules java.base,java.xml,jdk.zipfs,java.management,java.logging -cp "$api_jar:$impl:$tests" org.junit.runner.JUnitCore com.sun.source.util.TreesTest com.sun.tools.javac.parser.JavacParserTest
          fi

  stage-maven-repository:
    name: Stage Maven repository layout
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-input
          path: maven-input/
      - name: Assemble Maven repository tree
        shell: bash
        run: |
          set -euo pipefail
          api_jar=$(find maven-input -maxdepth 1 -name 'nb-javac-*-api.jar' -print -quit)
          if [[ -z "$api_jar" ]]; then
            echo "No API JAR found in maven-input/." >&2
            exit 1
          fi
          version=$(basename "$api_jar")
          version=${version#nb-javac-}
          version=${version%-api.jar}
          repository="maven-repository/com/dukescript/nbjavac/nb-javac/${version}"
          mkdir -p "$repository"
          cp maven-input/* "$repository/"
          (
            cd maven-repository
            find com -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload staged Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repository-${{ github.run_id }}
          path: maven-repository/
          if-no-files-found: error
          retention-days: 7
