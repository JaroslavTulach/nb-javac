name: CI
#
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: [push, pull_request]
#  push:
#    branches: [ master ]
jobs: 
  linux:
    name: "Backported nb-javac"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v2
      - name: Set up lower bound JDK
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: ${{ matrix.java }}
      - name: Record lower bound JDK ${{ matrix.java }}
        run: echo "$JAVA_HOME" | tee jdklow
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: 25.0.0
      - name: Record JDK25
        run: echo "$JAVA_HOME" | tee jdk25
      - name: Build on JDK25
        run: mvn -B package -DskipTests
      - name: Test on lower bound JDK
        run: JAVA_HOME=`cat jdklow` mvn -B test
      - name: Test on JDK25
        run: mvn -B test
      - name: Build patched JDK25
        run: ./build-jdk.sh
