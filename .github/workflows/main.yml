name: CI
#
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: [push, pull_request]
#  push:
#    branches: [ master ]
jobs: 
  build:
    name: "Build ${{ matrix.profile }} on JDK 25"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: ['jdk8+', 'jdk21+']
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 25
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: 25.0.0
      - name: Build profile
        run: mvn -B package -P${{ matrix.profile }}
      - name: Prepare Maven staging inputs
        shell: bash
        run: |
          set -euo pipefail
          api_jar=$(find target -maxdepth 1 -name 'nb-javac-*-api.jar' -print -quit)
          if [[ -z "$api_jar" ]]; then
            echo "No API JAR found in target/." >&2
            exit 1
          fi
          version=$(basename "$api_jar")
          version=${version#nb-javac-}
          version=${version%-api.jar}
          mkdir -p maven-staging
          cp "target/nb-javac-${version}.jar" maven-staging/
          cp "target/nb-javac-${version}-api.jar" maven-staging/
          cp "target/nb-javac-${version}-sources.jar" maven-staging/
          cp .flattened-pom.xml "maven-staging/nb-javac-${version}.pom"
      - name: Upload Maven staging inputs
        uses: actions/upload-artifact@v4
        with:
          name: maven-input-${{ matrix.profile }}
          path: maven-staging/
          if-no-files-found: error
          retention-days: 1
      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ matrix.profile }}
          path: target/
          if-no-files-found: error
          retention-days: 1
      - name: Build patched JDK25
        run: ./build-jdk.sh

  test:
    name: "Test ${{ matrix.profile }} on JDK ${{ matrix.java }}"
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: jdk8+
            java: '8'
          - profile: jdk8+
            java: '11'
          - profile: jdk8+
            java: '17'
          - profile: jdk8+
            java: '21'
          - profile: jdk8+
            java: '25'
          - profile: jdk21+
            java: '21'
          - profile: jdk21+
            java: '25'
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v2
        with:
            distribution: 'zulu'
            java-version: ${{ matrix.java }}
      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-${{ matrix.profile }}
          path: target/
      - name: Run tests on prebuilt classes
        run: mvn -B -P${{ matrix.profile }} surefire:test

  stage-maven-repository:
    name: Stage Maven repository layout
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download JDK 8+ artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-input-jdk8+
          path: profiles/jdk8+
      - name: Download JDK 21+ artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-input-jdk21+
          path: profiles/jdk21+
      - name: Assemble Maven repository tree
        shell: bash
        run: |
          set -euo pipefail
          api_jar=$(find profiles/jdk8+ -maxdepth 1 -name 'nb-javac-*-api.jar' -print -quit)
          if [[ -z "$api_jar" ]]; then
            echo "No JDK 8+ API JAR found in profiles/jdk8+." >&2
            exit 1
          fi
          version=$(basename "$api_jar")
          version=${version#nb-javac-}
          version=${version%-api.jar}
          repository="maven-repository/com/dukescript/nbjavac/nb-javac/${version}"
          mkdir -p "$repository"

          cp "profiles/jdk8+/nb-javac-${version}.pom" "$repository/"
          cp "profiles/jdk8+/nb-javac-${version}.jar" "$repository/"
          cp "profiles/jdk8+/nb-javac-${version}-api.jar" "$repository/"
          cp "profiles/jdk8+/nb-javac-${version}-sources.jar" "$repository/"

          cp "profiles/jdk21+/nb-javac-${version}.jar" "$repository/nb-javac-${version}-jdk21.jar"
          cp "profiles/jdk21+/nb-javac-${version}-sources.jar" "$repository/nb-javac-${version}-jdk21-sources.jar"

          (
            cd maven-repository
            find com -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload staged Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repository-${{ github.run_id }}
          path: maven-repository/
          if-no-files-found: error
          retention-days: 7
